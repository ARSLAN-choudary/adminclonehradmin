<div class="account-page">
  <!-- Main Wrapper -->
  <div class="main-wrapper">
    <div class="overflow-hidden p-3 acc-vh">
      <!-- start row -->
      <div class="row vh-100 w-100 g-0">
        <div class="col-lg-6 vh-100 overflow-y-auto overflow-x-hidden">
          <!-- start row -->
          <div class="row">
            <div class="col-md-10 mx-auto">
              <form
                (ngSubmit)="navigation()"
                class="vh-100 d-flex justify-content-between flex-column p-4 pb-0"
              >
                <!-- Logo -->
                <div class="text-center mb-4 auth-logo">
                  <img
                    src="assets/img/largeLogo.png"
                    class="img-fluid"
                    alt="Logo"
                  />
                </div>

                <!-- Verification Box -->
                <div
                  class="digit-group login-form-control"
                  data-group-name="digits"
                  data-autosubmit="false"
                >
                  <div class="mb-4">
                    <h4 class="mb-2 fs-20">Login With Your Email Address</h4>
                    <p>
                      We sent a verification code to your email.
                      Enter the code below and set your password to continue.
                    </p>
                  </div>

                  <!-- OTP Boxes -->
                  <div
                    class="d-flex align-items-center justify-content-center gap-3 mb-4"
                  >
                    <input
                      type="text"
                      class="text-center fs-26 fw-bold rounded"
                      id="digit-1"
                      name="digit-1"
                      maxlength="1"
                      [(ngModel)]="oneTimePassword.data1"
                      (input)="ValueChanged(oneTimePassword.data1, 'digit-1')"
                      (keydown.backspace)="tiggerBackspace(oneTimePassword.data1, 'digit-1')"
                    />
                    <input
                      type="text"
                      class="text-center fs-26 fw-bold rounded"
                      id="digit-2"
                      name="digit-2"
                      maxlength="1"
                      [(ngModel)]="oneTimePassword.data2"
                      (input)="ValueChanged(oneTimePassword.data2, 'digit-2')"
                      (keydown.backspace)="tiggerBackspace(oneTimePassword.data2, 'digit-2')"
                    />
                    <input
                      type="text"
                      class="text-center fs-26 fw-bold rounded"
                      id="digit-3"
                      name="digit-3"
                      maxlength="1"
                      [(ngModel)]="oneTimePassword.data3"
                      (input)="ValueChanged(oneTimePassword.data3, 'digit-3')"
                      (keydown.backspace)="tiggerBackspace(oneTimePassword.data3, 'digit-3')"
                    />
                    <input
                      type="text"
                      class="text-center fs-26 fw-bold rounded"
                      id="digit-4"
                      name="digit-4"
                      maxlength="1"
                      [(ngModel)]="oneTimePassword.data4"
                      (keydown.backspace)="tiggerBackspace(oneTimePassword.data4, 'digit-4')"
                    />
                  </div>

                  <!-- Password Field -->
                  <!-- <div class="mb-4 text-center">
                    <input
                      type="password"
                      class="form-control text-center py-2 fs-16 fw-normal rounded "
                      placeholder="Enter Your Password"
                      [(ngModel)]="password"
                      name="password"
                      required
                    />
                  </div> -->

                  <div class="text-center mb-3">
                    <p class="badge bg-light text-dark">
                      Otp will expire in 09 :10
                    </p>
                  </div>

                  <div class="mb-3">
                    <button
                      type="submit"
                      class="btn btn-primary w-100"
                      [disabled]="loading"
                    >
                      {{ loading ? "Verifying..." : "Verify My Account" }}
                    </button>
                  </div>

                  <p class="text-danger text-center">{{ errorMessage }}</p>
                </div>

                <!-- Footer -->
                <div class="text-center pb-4">
                  <p class="text-dark mb-0">
                    Copyright &copy; {{ currentYear }} - My Planet
                  </p>
                </div>
              </form>
            </div>
            <!-- end col -->
          </div>
          <!-- end row -->
        </div>

        <div class="col-lg-6 account-bg-06"></div>
        <!-- end col -->
      </div>
      <!-- end row -->
    </div>
  </div>
  <!-- End Wrapper -->
</div>
