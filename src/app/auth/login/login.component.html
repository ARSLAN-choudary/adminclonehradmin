<div class="account-page bg-white">
    <!-- Begin Wrapper -->
    <div class="main-wrapper">

        <div class="overflow-hidden p-3 acc-vh">

            <!-- start row -->
            <div class="row vh-100 w-100 g-0">

                <div class="col-lg-6 vh-100 overflow-y-auto overflow-x-hidden">

                    <!-- start row -->
                    <div class="row">

                        <div class="col-md-10 mx-auto">
                            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()"
                                class=" vh-100 d-flex justify-content-between flex-column p-4 pb-0">
                                <div class="text-center mb-4 auth-logo">
                                    <img src="assets/img/largeLogo.png" class="img-fluid logo" alt="Logo">
                                </div>
                                <div>
                                    <div class="mb-3">
                                        <h3 class="mb-2">Sign In</h3>
                                        <p class="mb-0">Access My Planet using your email and passcode.</p>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Email Address</label>
                                        <div class="input-group input-group-flat">
                                            <input type="email" class="form-control" formControlName="email" id="email">
                                            <span class="input-group-text">
                                                <i class="ti ti-mail"></i>
                                            </span>
                                        </div>
                                        <div *ngIf="email.invalid && email.touched" class="text-danger fs-12 mt-1">
                                            <div *ngIf="email.errors?.['required']">Email is required.</div>
                                            <div *ngIf="email.errors?.['email']">Enter a valid email.</div>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Password</label>
                                        <div class="input-group input-group-flat pass-group">
                                            <input [type]="!hidePassword ? 'text' : 'password' " id="password"
                                                formControlName="password" class="pass-input form-control">
                                            <span class="input-group-text toggle-password" (click)="togglePassword(1)"
                                                tabindex="0"><i class="ti"
                                                    [ngClass]=" hidePassword ? 'ti-eye' : 'ti-eye-off'"></i></span>
                                        </div>
                                        <div *ngIf="password.invalid && password.touched"
                                            class="text-danger fs-12 mt-1">
                                            <div *ngIf="password.errors?.['required']">Password is required.</div>
                                        </div>
                                    </div>
                                    <div class="d-flex align-items-center justify-content-between mb-3">
                                        <div class="form-check form-check-md d-flex align-items-center">
                                            <input class="form-check-input mt-0" type="checkbox" value=""
                                                id="remmeberMe" formControlName="rememberMe" id="checkebox-md"
                                                checked="">
                                            <label class="form-check-label text-dark ms-1" for="checkebox-md">
                                                Remember Me
                                            </label>
                                        </div>
                                        <div class="text-end">
                                            <a [routerLink]="routes.forgotPassword"
                                                class="link-danger fw-medium link-hover">Forgot Password?</a>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <button type="submit" class="btn btn-primary w-100">Sign In</button>
                                    </div>
                                    <div class="mb-3">
                                        <p class="mb-0">New on our platform?<a [routerLink]="routes.register"
                                                class="link-indigo fw-bold link-hover"> Create an account</a></p>
                                    </div>
                                    <div class="or-login text-center position-relative mb-3">
                                        <h6 class="fs-14 mb-0 position-relative text-body">OR</h6>
                                    </div>
                                    <div class="d-flex align-items-center justify-content-center flex-wrap gap-2 mb-3">
                                        <div class="text-center flex-fill">
                                            <a href="javascript:void(0);"
                                                class="p-2 btn btn-info d-flex align-items-center justify-content-center">
                                                <img class="img-fluid m-1" src="assets/img/icons/facebook-logo.svg"
                                                    alt="Facebook">
                                            </a>
                                        </div>
                                        <div class="text-center flex-fill">
                                            <a href="javascript:void(0);"
                                                class="p-2 btn btn-outline-light d-flex align-items-center justify-content-center">
                                                <img class="img-fluid  m-1" src="assets/img/icons/google-logo.svg"
                                                    alt="Facebook">
                                            </a>
                                        </div>
                                        <div class="text-center flex-fill">
                                            <a href="javascript:void(0);"
                                                class="p-2 btn btn-dark d-flex align-items-center justify-content-center">
                                                <img class="img-fluid  m-1" src="assets/img/icons/apple-logo.svg"
                                                    alt="Apple">
                                            </a>
                                        </div>
                                    </div>
                                </div>
                                <div class="text-center pb-4">
                                    <p class="text-dark mb-0">Copyright &copy; 2025 - CRMS</p>
                                </div>
                            </form>
                        </div> <!-- end col -->

                    </div>
                    <!-- end row -->

                </div>

                <div class="col-lg-6 account-bg-01"></div> <!-- end col -->

            </div>
            <!-- end row -->

        </div>

    </div>
    <!-- End Wrapper -->
</div>
