<div class="account-page">
  <div class="main-wrapper">
    <div class="overflow-hidden p-2 acc-vh">
      <div class="row vh-100 w-100 g-0">
        <div class="col-lg-6 vh-100 overflow-y-auto overflow-x-hidden position-relative">
          <div class="row">
            <div class="col-md-10 mx-auto">
              <form (ngSubmit)="verifyOtp()" class="vh-100 d-flex flex-column justify-content-center p-4 pb-0">
                <!-- Logo -->
                <div class="text-center mb-4 auth-logo">
                  <img src="assets/img/largeLogo.png" class="img-fluid" alt="Logo" />
                </div>

                <!-- Verification Box -->
                <div class="digit-group login-form-control " style="margin-top: 50px;" data-group-name="digits"
                  data-autosubmit="false">
                  <div class="mb-4">
                    <h4 class="mb-2 fs-20">Verify Your Email</h4>
                    <p>
                      We sent a verification code to your email
                      <strong>{{ email }}</strong>. Enter the 4-digit code below
                      to verify your account.
                    </p>
                  </div>

                  <!-- OTP Boxes -->
                  <div class="d-flex align-items-center justify-content-center gap-md-3 gap-1 mb-4">
                    <input type="text"  maxlength="1"
                       pattern="[0-9]*" class="text-center fs-26 fw-bold rounded" id="digit-1" name="digit-1"
                       [(ngModel)]="oneTimePassword.data1"
                      (input)="ValueChanged(oneTimePassword.data1, 'digit-1')"
                      (keydown.backspace)="tiggerBackspace(oneTimePassword.data1, 'digit-1')" />
                    <input type="text"  pattern="[0-9]*" class="text-center fs-26 fw-bold rounded" id="digit-2" name="digit-2"
                      maxlength="1" [(ngModel)]="oneTimePassword.data2"
                      (input)="ValueChanged(oneTimePassword.data2, 'digit-2')"
                      (keydown.backspace)="tiggerBackspace(oneTimePassword.data2, 'digit-2')" />
                    <input type="number" class="text-center fs-26 fw-bold rounded" id="digit-3" name="digit-3"
                      maxlength="1" [(ngModel)]="oneTimePassword.data3"
                      (input)="ValueChanged(oneTimePassword.data3, 'digit-3')"
                      (keydown.backspace)="tiggerBackspace(oneTimePassword.data3, 'digit-3')" />
                    <input type="number" class="text-center fs-26 fw-bold rounded" id="digit-4" name="digit-4"
                      maxlength="1" [(ngModel)]="oneTimePassword.data4"
                      (keydown.backspace)="tiggerBackspace(oneTimePassword.data4, 'digit-4')" />
                  </div>

                  <!-- Timer -->
                  <div class="text-center mb-3">
                    <p class="badge bg-light text-dark">
                      OTP will expire in {{ countdownDisplay }}
                    </p>
                  </div>

                  <!-- Submit -->
                  <div class="mb-3">
                    <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
                      {{ loading ? "Verifying..." : "Verify My Account" }}
                    </button>
                  </div>

                  <p class="text-danger text-center">{{ errorMessage }}</p>
                </div>

                <!-- Footer -->
                <div class="text-center pb-4 d-flex align-items-end justify-content-center"
                  style="position: absolute; bottom: 20px; width: 100%; left: 0px;">
                  <p class="text-dark mb-0">
                    Copyright &copy; {{ currentYear }} - My Planet
                  </p>
                </div>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-6 account-bg-06"></div>
      </div>
    </div>
  </div>
</div>
