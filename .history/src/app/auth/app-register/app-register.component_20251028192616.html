<div class="account-page bg-white">
  <div class="main-wrapper">
    <div class="overflow-hidden p-3 acc-vh">
      <div class="row vh-100 w-100 g-0">
        <div class="col-lg-6 vh-100 overflow-y-auto overflow-x-hidden">
          <div class="row">
            <div class="col-md-10 mx-auto">

              <!-- Step 1: Register -->
              <form class="vh-100 d-flex flex-column p-4 pb-0 fade-in" *ngIf="!isRegistered">
                <!-- Logo -->
                <div class="text-center mb-4 auth-logo">
                  <img src="assets/img/largeLogo.png" class="img-fluid" alt="Logo" />
                </div>

                <!-- Heading -->
                <div class="mb-5">
                  <h3 class="mb-2">Register</h3>
                  <p class="mb-0">
                    Please register using your position to access the MY PLANET system.
                  </p>
                </div>

                <!-- Position -->
                <div class="mb-3">
                  <label for="position" class="form-label">Position</label>
                  <select id="position" class="form-select" [(ngModel)]="selectedPosition" name="position"
                    (change)="onPositionSelect()">
                    <option value="">Select Position</option>
                    <option *ngFor="let p of availablePositions" [value]="p">
                      {{ p }}
                    </option>
                  </select>
                </div>
              </form>

              <!-- ✅ Success Screen -->
              <div class="vh-100 d-flex flex-column justify-content-center align-items-center text-center fade-in"
                *ngIf="isRegistered">
                <img src="assets/img/success-icon.png" alt="Success" class="mb-4" width="100">
                <h3 class="text-success mb-2">Successfully Registered!</h3>
                <p class="text-muted mb-3">
                  You have successfully registered for the post of
                  <strong class="text-primary">{{ selectedPosition }}</strong>.
                </p>
                <p class="text-muted">Pending for admin approval.</p>

                <button class="btn btn-outline-primary mt-4" (click)="resetForm()">
                  Back to Register
                </button>
              </div>

            </div>
          </div>
        </div>

        <!-- Right side background -->
        <div class="col-lg-6 account-bg-01 hiding"></div>
      </div>
    </div>
  </div>
</div>
