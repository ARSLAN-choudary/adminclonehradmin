<div class="account-page bg-white ">
  <div class="main-wrapper ">
    <div class=" p-3 acc-vh ">
      <div class="row vh-100 w-100 g-0 ">
        <div class="col-lg-6 overflow-y-auto form-scroll overflow-x-hidden">
          <div class="row">
            <div class="col-md-10 mx-auto">

              <!-- Step 1: Register / Send OTP -->
              <form class="d-flex flex-column px-4 py-0 fade-in">

                <!-- Logo -->
                <div class="text-center mb-4 auth-logo">
                  <img src="assets/img/largeLogo.png" class="img-fluid" alt="Logo" />
                </div>

                <!-- Heading -->
                <div class="mb-3">
                  <h3 class="mb-2">Register</h3>
                  <p class="mb-0">
                    Please register using your position and email to access the MY PLANET system.
                  </p>
                </div>

                <!-- Country -->
                <!-- <div class="mb-3">
                  <label for="country" class="form-label">Country</label>
                  <div class="input-group input-group-flat position-relative">
                    <select id="country" class="form-select" [value]="country()" (change)="onCountryChange($event)">
                      <option value="">Select Country</option>
                      <option value="United States">United States</option>
                      <option value="India">India</option>
                      <option value="United Kingdom">United Kingdom</option>
                      <option value="Canada">Canada</option>
                      <option value="Australia">Australia</option>
                    </select>
                  </div>
                </div> -->

                <!-- Position -->
                <div class="mb-3" *ngIf="!noPositionAvailable">
                  <label for="position" class="form-label">Position</label>
                  <select id="position" class="form-select" (change)="onPositionChange($event)">
                    <option value="">Select Position</option>
                    <option *ngFor="let p of countryPositions" [value]="p">{{ p }}</option>
                  </select>
                </div>


                <div class="mb-3" *ngIf="noPositionAvailable">
                  <div>{{noPositionAvailable}}</div>
                </div>

                <!-- Email -->
                <div class="mb-3" *ngIf="position()">
                  <label for="email" class="form-label">Email</label>
                  <input #emailInput type="email" class="form-control" [value]="email()" (input)="onEmailInput($event)"
                    (focus)="scrollToInput(emailInput)" placeholder="Enter your email">
                  <div class="text-danger small mt-1" *ngIf="email() && !isEmailValid()">Please enter a valid email
                    address</div>
                </div>

                <!-- Step 1 Button -->
                <div class="mb-5 fade-in" *ngIf="isEmailValid()">
                  <button type="button" class="btn btn-primary w-100" [disabled]="!isEmailValid() || loading()"
                    (click)="sendOtp()">
                    {{ loading() ? 'Sending OTP...' : 'Send OTP' }}
                  </button>
                </div>

                <div class="text-danger text-center mt-2">{{ errorMessage() }}</div>

              </form>


              <!-- <div class="text-center pb-4">
                <p class="text-dark mb-0">
                  Copyright &copy; {{ currentYear }} - My Planet
                </p>
              </div> -->



            </div>
          </div>
        </div>

        <!-- Background Section -->
        <div class="col-lg-6 account-bg-01 hiding"></div>
      </div>
    </div>
  </div>
</div>

<div *ngIf="isLoading" class="loader-overlay">
  <div class="spinner-wrapper">
    <div class="spinner-border text-primary me-1" role="status">
      <span class="sr-only">Loading...</span>
    </div>
  </div>
</div>
